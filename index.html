<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nosso Portal Pop</title>
    <style>
        /* A mágica do visual (CSS) acontece aqui! */
        body {
            background-color: #1a1a2e; /* Fundo escuro (Dark mode) */
            color: #ffffff; /* Letras brancas */
            font-family: 'Segoe UI', Tahoma, sans-serif; /* Fonte moderna e limpa */
            text-align: center; /* Centraliza tudo */
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #e94560; /* Título em rosa/vermelho neon */
            font-size: 3em; /* Deixa o título bem grande */
        }

        h2 {
            color: #1a1a2e; 
            background-color: #00e0ff; /* Fundo azul neon pro subtítulo */
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px; /* Deixa as bordas arredondadas */
        }

        ul {
            list-style-type: none; /* Tira as bolinhas chatas da lista */
            padding: 0;
        }

        li {
            background-color: #16213e; /* Fundo das caixinhas */
            margin: 15px auto; /* Centraliza e dá espaço entre elas */
            padding: 15px;
            width: 50%; /* Largura da caixinha */
            border-radius: 8px;
            border: 2px solid #e94560; /* Bordinha neon */
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Bem-vindos ao Portal! 🎬🎮</h1>
    <p>O seu novo QG para cultura pop, filmes, séries e games.</p>
    
    <h2>O que vem por aí:</h2>
    <ul>
        <li>🍿 Reviews de Filmes</li>
        <li>👽 Teorias de Séries</li>
        <li>🕹️ Dicas de Games</li>
    </ul>
</body>
</html>
